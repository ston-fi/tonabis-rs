[workspace]
members = [
    "crates/core",
    "crates/dedust",
    "crates/moon",
    "crates/stonks",
    "crates/swap_coffee",
    "crates/tonco",
    "crates/tonabis",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Proprietary"
repository = "https://github.com/ston-fi/tonabis-rs"

[workspace.dependencies]
tonabis_core = { path = "crates/core", version = "0.1" }
tonabis_dedust = { path = "crates/dedust", version = "0.1" }
tonabis_moon = { path = "crates/moon", version = "0.1" }
tonabis_stonks = { path = "crates/stonks", version = "0.1" }
tonabis_swap_coffee = { path = "crates/swap_coffee", version = "0.1" }
tonabis_tonco = { path = "crates/tonco", version = "0.1" }
thiserror = "2"
num-bigint = "0.4"
fastnum = { version = "0.7", features = ["numtraits"] }
ton = "0.4.12"
ton_core = "0.3.11"
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-test = "0.4"

[profile.dev]
debug = false
